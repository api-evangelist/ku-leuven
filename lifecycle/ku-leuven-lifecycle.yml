observations:
- No deprecation policy, sunset header, changelog or status page was found for any surface.
- >-
  The one genuinely good lifecycle signal in the estate is accidental: the snapshot index names on
  dataservice.kuleuven.be tell a consumer exactly how stale each dataset is.
- >-
  security.txt at https://www.kuleuven.be/.well-known/security.txt carries an Expires value of
  2026-04-16, which is both malformed and in the past.
