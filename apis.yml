x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    KU Leuven is a rare positive case in this cohort: it operates real machine-readable surfaces on
    its own infrastructure, and every one of them was reached and read on 2026-08-19. The ICTS Data
    Services gateway at dataservice.kuleuven.be answered unauthenticated searches across eight
    public index families with real records; the self-hosted Dataverse 6.7.1 RDR serves its own
    OpenAPI publicly (correcting the June 2026 review, which recorded it as restricted to KU Leuven
    IPs); two OAI-PMH endpoints identified themselves; the Shibboleth IdP served signed SAML 2.0
    metadata; and DataCite confirmed the RDR as repository client BRVZ.RDR. Nothing here is a
    vendor's contract attributed to the institution, and no tenant relationship was found that
    needed relabelling — the hosts all resolve inside KU Leuven's own 134.58.0.0/16 space. What is
    genuinely absent is a developer program: no unified portal, no self-serve credential, no
    published scopes, no versioning on the data services gateway, no changelog, deprecation policy
    or status page, no llms.txt, and no machine-readable description authored by KU Leuven for its
    own data services — the OpenAPI in this repository is derived by API Evangelist from KU Leuven's
    Dutch documentation and verified against live responses. Two defects worth naming: an
    unpublished index returns an HTML 503 rather than a 404, and security.txt carries a malformed,
    expired Expires value of 2026-04-16.
  evidence:
  - url: https://dataservice.kuleuven.be/employee/_search?size=1
    status: 200
    note: Staff directory index, unauthenticated, real records, hit count capped at 10,000.
  - url: https://dataservice.kuleuven.be/cv/_search?size=1
    status: 200
    note: Curriculum index; returned an ORCID iD in the orcId field.
  - url: https://dataservice.kuleuven.be/organigram/_search?size=1
    status: 200
    note: 2,264 organisational units; publishes staff names and work phone numbers openly.
  - url: https://dataservice.kuleuven.be/pg/_search?size=1
    status: 200
    note: Programme guide, 5,026 documents through the current-year alias (pg2025 snapshot).
  - url: https://dataservice.kuleuven.be/pg2026/_search?size=1
    status: 200
    note: Next academic year addressable directly, 2,543 documents.
  - url: https://dataservice.kuleuven.be/onderzoeksproject/_search?size=1
    status: 200
    note: Research projects; snapshot index dated 2025-04-09, over sixteen months stale.
  - url: https://dataservice.kuleuven.be/onderzoeksteams/_search?size=1
    status: 200
    note: 740 research teams.
  - url: https://dataservice.kuleuven.be/onderzoeksinfrastructuur/_search?size=1
    status: 200
    note: 379 research infrastructure records.
  - url: https://dataservice.kuleuven.be/jobsite/_search?size=1
    status: 200
    note: 132 open vacancies.
  - url: https://dataservice.kuleuven.be/
    status: 503
    note: Gateway root and any unpublished index name return an HTML 503, not a 404.
  - url: https://dataservice.kuleuven.be/opleidingsonderdelen/_search
    status: 503
    note: Course-component API is documented as "in opbouw"; no index answers.
  - url: https://rdr.kuleuven.be/openapi
    status: 200
    note: >-
      Dataverse 6.7.1 description served publicly, 425 paths, info.title "Dataverse API" and no
      servers block — the contract is upstream Dataverse's, the deployment is KU Leuven's.
  - url: https://rdr.kuleuven.be/api/info/version
    status: 200
    note: Version 6.7.1 confirmed live.
  - url: https://rdr.kuleuven.be/api/search?q=*&type=dataset&per_page=1
    status: 200
    note: 830 published datasets, first item doi:10.48804/SLMHLZ.
  - url: https://rdr.kuleuven.be/oai?verb=Identify
    status: 200
    note: OAI-PMH 2.0, "KU Leuven RDR Dataverse OAI Archive".
  - url: https://lirias.kuleuven.be/oai?verb=Identify
    status: 200
    note: OAI-PMH 2.0, Lirias institutional repository; previously uncatalogued.
  - url: https://idp.kuleuven.be/idp/shibboleth
    status: 200
    note: >-
      SAML 2.0 metadata, entityID urn:mace:kuleuven.be:kulassoc:kuleuven.be, Belnet registration
      authority, REFEDS SIRTFI and R&S.
  - url: https://api.datacite.org/clients/brvz.rdr
    status: 200
    note: DataCite repository client "KU Leuven RDR", prefix 10.48804, member since 2021.
  - url: https://webws.aps.kuleuven.be
    status: 0
    note: Timetable OData production host does not resolve from the public internet.
  - url: https://webwsq.aps.kuleuven.be/sap/opu/odata/sap/zc_ep_uurrooster_oauth_srv/$metadata
    status: 403
    note: Acceptance host reachable, refuses unauthenticated metadata reads.
  - url: https://www.kuleuven.be/.well-known/security.txt
    status: 200
    note: Real security.txt with an Intigriti program, but Expires is malformed and expired.
  - url: https://www.kuleuven.be/english/genai
    status: 200
    note: Institutional generative-AI policy; governance document, not an API artifact.
  - url: https://onderwijsaanbod.kuleuven.be
    status: 200
    note: HTML programme guide fronting the same data the pg indices serve.
  - url: https://api.github.com/orgs/kuleuven/repos
    status: 200
    note: >-
      132 repositories, largely the ManGO iRODS research-data platform and Puppet modules; no
      first-party OpenAPI, AsyncAPI or apis.json in the org.
  - url: https://data.kuleuven.be
    status: 0
    note: No CKAN/Socrata open-data portal exists at the conventional hostname.
