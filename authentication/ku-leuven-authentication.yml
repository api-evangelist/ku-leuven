summary: >-
  KU Leuven's public programmable surface is overwhelmingly unauthenticated read. The only
  credentialed surfaces are the RDR write path (institution-issued API token gated on ORCID and a
  role) and the personal timetable (OAuth authorization code, credentials issued on request). No
  self-serve developer key exists anywhere in the estate.
