---
aid: ku-leuven
name: KU Leuven
x-type: university
x-category: Public Research University
description: >-
  KU Leuven (Katholieke Universiteit Leuven) is a Flemish public research university in Leuven,
  Belgium, founded in 1425 and ranked in the QS world top 50. Re-profiled on 2026-08-19 with
  operator attribution settled before anything was saved, it is one of the few universities in this
  cohort whose machine-readable surface is genuinely its own: every host below resolves inside
  KU Leuven's own 134.58.0.0/16 address space, and no Figshare, Elsevier Pure, Ex Libris or
  Symplectic contract is attributed here. Its central programmable surface is the ICTS Data
  Services gateway at dataservice.kuleuven.be — an unauthenticated OpenSearch query API over eight
  public index families covering the staff directory, academic CVs, the organisational chart, the
  programme guide, research projects, research teams, research infrastructure and job vacancies —
  documented in Dutch at admin.kuleuven.be and confirmed live returning real records. It also runs
  the Research Data Repository (RDR), a self-hosted Dataverse 6.7.1 installation at rdr.kuleuven.be
  that serves its own OpenAPI publicly, mints DOIs as DataCite repository client BRVZ.RDR, and
  exposes OAI-PMH; the Lirias institutional repository exposes a second OAI-PMH endpoint; and
  idp.kuleuven.be serves SAML 2.0 Shibboleth metadata registered in the Belnet federation with
  REFEDS SIRTFI and Research & Scholarship assurance. Honest caveats: the 36 RDR entries below are
  tag-splits of ONE Dataverse deployment, and that contract is upstream open-source Dataverse's
  work — KU Leuven operates the deployment and owns the data, it does not author the API. There is
  no unified developer portal, no self-serve credential anywhere in the estate, no versioning on
  the data services gateway, and the personal timetable API's production host does not resolve from
  the public internet.
type: Index
