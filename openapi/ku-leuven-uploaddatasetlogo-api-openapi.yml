openapi: 3.0.3
info:
  title: KU Leuven Research Data Repository (RDR) Access uploadDatasetLogo API
  description: Dataverse-based institutional research data repository API for KU Leuven (rdr.kuleuven.be), running Dataverse 6.7.1. Public info endpoints are reachable without authentication; write operations require an API token, a registered ORCID, and the Dataset Creator role.
  version: 6.7.1
servers:
- url: https://rdr.kuleuven.be/api
  description: KU Leuven Research Data Repository (RDR) production API
tags:
- name: uploadDatasetLogo
  description: Uploads a logo for a dataset
paths:
  /datasets/{id}/thumbnail:
    post:
      tags:
      - uploadDatasetLogo
      summary: Uploads a logo for a dataset
      description: Uploads a logo for a dataset
      operationId: Datasets_uploadDatasetLogo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              format: binary
              type: string
      responses:
        '200':
          description: Dataset logo uploaded successfully
