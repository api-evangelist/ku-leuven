finding: none_published
detail: >-
  No OAuth scope, no API-key scope and no permission string is published for any KU Leuven surface.
  The public ICTS Data Services indices need no authorization at all. The RDR uses Dataverse's role
  model rather than scopes — access is decided by role assignment (Dataset Creator and the roles
  managed under /roles and /admin), not by a scope granted to a client. The timetable API documents
  an OAuth authorization-code grant but publishes no scope names, and client credentials are issued
  by KU Leuven case by case.
