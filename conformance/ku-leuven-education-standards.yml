    verified: '2026-08-19'
  - type: live
    url: https://rdr.kuleuven.be/api/search?q=*&type=dataset&per_page=1
    status: 200
    detail: >-
      830 published datasets; first item carries global_id doi:10.48804/SLMHLZ resolving via
      https://doi.org/10.48804/SLMHLZ.
    verified: '2026-08-19'
  - type: contract
