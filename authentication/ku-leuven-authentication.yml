  - url: https://webwsq.aps.kuleuven.be/sap/opu/odata/sap/zc_ep_uurrooster_oauth_srv/$metadata
    status: 403
    note: Acceptance host reachable but refuses unauthenticated metadata reads.
- surface: Identity provider
  base_url: https://idp.kuleuven.be/idp/shibboleth
  operator: institution
  auth: saml2
  detail: >-
    Shibboleth IdP, entityID urn:mace:kuleuven.be:kulassoc:kuleuven.be, registered by the Belnet
