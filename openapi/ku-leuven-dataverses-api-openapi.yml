        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      tags:
      - Dataverses
      summary: Dataverses add dataverse
      x-summary-source: derived
    delete:
      operationId: Dataverses_deleteDataverse
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
      tags:
