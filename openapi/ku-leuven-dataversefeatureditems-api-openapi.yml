openapi: 3.0.3
info:
  title: KU Leuven Research Data Repository (RDR) Access DataverseFeaturedItems API
  description: Dataverse-based institutional research data repository API for KU Leuven (rdr.kuleuven.be), running Dataverse 6.7.1. Public info endpoints are reachable without authentication; write operations require an API token, a registered ORCID, and the Dataset Creator role.
  version: 6.7.1
servers:
- url: https://rdr.kuleuven.be/api
  description: KU Leuven Research Data Repository (RDR) production API
tags:
- name: DataverseFeaturedItems
paths:
  /dataverseFeaturedItems/{id}:
    put:
      operationId: DataverseFeaturedItems_updateFeaturedItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int64
          type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
      responses:
        '200':
          description: OK
      tags:
      - DataverseFeaturedItems
    delete:
      operationId: DataverseFeaturedItems_deleteFeaturedItem
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: int64
          type: integer
      responses:
        '200':
          description: OK
      tags:
      - DataverseFeaturedItems
