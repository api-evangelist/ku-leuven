openapi: 3.2.0
info:
  title: KU Leuven Research Data Repository (RDR) Dataverses API
  description: Dataverse-based institutional research data repository API for KU Leuven (rdr.kuleuven.be), running Dataverse 6.7.1. Public info endpoints are reachable without authentication; write operations require an API token, a registered ORCID, and the Dataset Creator role.
  version: 6.7.1
servers:
- url: https://rdr.kuleuven.be/api
  description: KU Leuven Research Data Repository (RDR) production API
tags:
- name: Dataverses
paths:
  /dataverses:
    post:
      operationId: Dataverses_addRoot
      responses:
        '200':
          description: OK
      tags:
      - Dataverses
      summary: Dataverses add root
      x-summary-source: derived
  /dataverses/{dataverseId}/featuredItems:
    put:
      operationId: Dataverses_updateFeaturedItems
      parameters:
      - name: dataverseId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: array
              items:
                format: int64
                type: integer
      responses:
        '200':
          description: OK
      tags:
      - Dataverses
      summary: Dataverses update featured items
      x-summary-source: derived
  /dataverses/{identifier}:
    get:
      operationId: Dataverses_getDataverse
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      - name: returnChildCount
        in: query
        schema:
          type: boolean
      - name: returnOwners
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
      tags:
      - Dataverses
      summary: Dataverses get dataverse
      x-summary-source: derived
    put:
      operationId: Dataverses_updateDataverse
      parameters:
      - name: identifier
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
