openapi: 3.0.3
info:
  title: KU Leuven Research Data Repository (RDR) Access addFileToDataset API
  description: Dataverse-based institutional research data repository API for KU Leuven (rdr.kuleuven.be), running Dataverse 6.7.1. Public info endpoints are reachable without authentication; write operations require an API token, a registered ORCID, and the Dataset Creator role.
  version: 6.7.1
servers:
- url: https://rdr.kuleuven.be/api
  description: KU Leuven Research Data Repository (RDR) production API
tags:
- name: addFileToDataset
  description: Uploads a file for a dataset
paths:
  /datasets/{id}/add:
    post:
      tags:
      - addFileToDataset
      summary: Uploads a file for a dataset
      description: Uploads a file for a dataset
      operationId: Datasets_addFileToDataset
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: string
      responses:
        '200':
          description: File uploaded successfully to dataset
