  evidence:
  - url: https://idp.kuleuven.be/idp/shibboleth
    status: 200
- surface: OAI-PMH harvesting
  base_url: https://rdr.kuleuven.be/oai
  operator: institution
  auth: none
  detail: Public harvesting interface; likewise https://lirias.kuleuven.be/oai.
  evidence:
